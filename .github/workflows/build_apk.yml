name: Build JARVIS PRO Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Purge Old Android & Generate Modern V2 Structure
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=jarvis_pro --org=com.topg.jarvis
      - name: Build Release APK
        run: flutter build apk --release --no-pub
      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: JarvisPro-Topg-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
