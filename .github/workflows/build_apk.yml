name: Build JARVIS PRO Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Recreate Android V2 & Force Kotlin 2.1.0 Everywhere
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=jarvis_pro --org=com.topg.jarvis

          # 1. settings.gradle mein Kotlin 2.1.0 set karo
          if [ -f "android/settings.gradle" ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.1.0"/g' android/settings.gradle
          fi

          # 2. Sabhi downloaded plugins (.pub-cache) ke andar bhi Kotlin 2.1.0 update karo
          find "$HOME/.pub-cache" -name "build.gradle" -exec sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '2.1.0'/g" {} + || true

          # 3. android/build.gradle mein kotlin-stdlib 2.1.0 aur compileSdk 34 force karo
          cat << 'EOF' > android/build.gradle
          buildscript {
              ext.kotlin_version = '2.1.0'
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
              configurations.all {
                  resolutionStrategy {
                      force "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.0"
                  }
              }
          }
          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 34
                          if (namespace == null) {
                              namespace "com.topg.${project.name.replace('-', '_')}"
                          }
                      }
                  }
              }
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }
          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          # 4. App build.gradle mein minSdk 24 aur compileSdk 34 set karo
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle
          fi

      - name: Build Release APK
        run: flutter build apk --release --no-pub --no-shrink

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: JarvisPro-Topg-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
