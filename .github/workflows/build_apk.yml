name: Build JARVIS PRO Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Mek Nyu Jarvis Pro App Frɔm Skrach
        run: |
          flutter create --org com.topg --project-name jarvis_pro fresh_jarvis
          cat << 'EOF' > fresh_jarvis/lib/main.dart
          import 'dart:async';
          import 'package:flutter/material.dart';

          void main() {
            runApp(const JarvisProApp());
          }

          class JarvisProApp extends StatelessWidget {
            const JarvisProApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'JARVIS PRO',
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF050B14),
                ),
                home: const JarvisHudScreen(),
              );
            }
          }

          class JarvisHudScreen extends StatefulWidget {
            const JarvisHudScreen({super.key});

            @override
            State<JarvisHudScreen> createState() => _JarvisHudScreenState();
          }

          class _JarvisHudScreenState extends State<JarvisHudScreen>
              with SingleTickerProviderStateMixin {
            late AnimationController _controller;
            bool _listening = false;
            String _statusText = 'SISTƐM RƐDI • TAP DI KƆR FƆ TƆK';
            final TextEditingController _inputController = TextEditingController();
            final List> _logs = [
              {'role': 'JARVIS', 'msg': 'Jarvis Pro v2.0 ɔnlayn. Ɔl sistɛm dɛn klin.'},
            ];

            @override
            void initState() {
              super.initState();
              _controller = AnimationController(
                vsync: this,
                duration: const Duration(seconds: 4),
              )..repeat(reverse: true);
            }

            @override
            void dispose() {
              _controller.dispose();
              _inputController.dispose();
              super.dispose();
            }

            void _sendCommand(String cmd) {
              if (cmd.trim().isEmpty) return;
              setState(() {
                _logs.add({'role': 'YUZΑ', 'msg': cmd});
                _statusText = 'JARVIS DE PRƆSƐS...';
              });
              _inputController.clear();

              Timer(const Duration(milliseconds: 600), () {
                String reply = 'Kɔmand "$cmd" dɔn rɔn witawt ɛni wahala.';
                final lower = cmd.toLowerCase();
                if (lower.contains('status')) {
                  reply = 'CPU: 18% | RAM: 2.1 GB | Bɛtri: 98% | Sekyuriti: Lɔk.';
                } else if (lower.contains('time')) {
                  reply = 'Sistɛm taym na: ${DateTime.now().toLocal()}';
                } else if (lower.contains('hello') || lower.contains('jarvis')) {
                  reply = 'A de ya, Bɔs. Wetin wi de bild tide?';
                }
                setState(() {
                  _logs.add({'role': 'JARVIS', 'msg': reply});
                  _statusText = 'SISTƐM RƐDI • TAP DI KƆR FƆ TƆK';
                });
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: const Color(0xFF0A1526),
                  title: const Text(
                    'J.A.R.V.I.S. PRO HUD',
                    style: TextStyle(
                      color: Color(0xFF00E5FF),
                      letterSpacing: 3,
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                  centerTitle: true,
                ),
                body: Column(
                  children: [
                    const SizedBox(height: 24),
                    GestureDetector(
                      onTap: () {
                        setState(() {
                          _listening = !_listening;
                          _statusText = _listening
                              ? 'JARVIS DE LISIN NAW...'
                              : 'SISTƐM RƐDI • TAP DI KƆR FƆ TƆK';
                        });
                      },
                      child: AnimatedBuilder(
                        animation: _controller,
                        builder: (context, child) {
                          final scale = 1.0 + (_controller.value * 0.12);
                          return Transform.scale(
                            scale: _listening ? scale : 1.0,
                            child: Container(
                              width: 150,
                              height: 150,
                              decoration: BoxDecoration(
                                shape: BoxShape.circle,
                                border: Border.all(
                                  color: _listening
                                      ? const Color(0xFFFF3D00)
                                      : const Color(0xFF00E5FF),
                                  width: 4,
                                ),
                                boxShadow: [
                                  BoxShadow(
                                    color: (_listening
                                            ? const Color(0xFFFF3D00)
                                            : const Color(0xFF00E5FF))
                                        .withOpacity(0.45),
                                    blurRadius: 28,
                                    spreadRadius: 6,
                                  ),
                                ],
                              ),
                              alignment: Alignment.center,
                              child: Text(
                                _listening ? 'REC' : 'JARVIS',
                                style: const TextStyle(
                                  color: Color(0xFF00E5FF),
                                  fontSize: 22,
                                  fontWeight: FontWeight.bold,
                                  letterSpacing: 2,
                                ),
                              ),
                            ),
                          );
                        },
                      ),
                    ),
                    const SizedBox(height: 16),
                    Text(
                      _statusText,
                      style: const TextStyle(
                        color: Color(0xFF80DEEA),
                        letterSpacing: 1.5,
                        fontSize: 12,
                      ),
                    ),
                    const SizedBox(height: 16),
                    Expanded(
                      child: ListView.builder(
                        padding: const EdgeInsets.symmetric(horizontal: 16),
                        itemCount: _logs.length,
                        itemBuilder: (context, index) {
                          final item = _logs[index];
                          final isJarvis = item['role'] == 'JARVIS';
                          return Container(
                            margin: const EdgeInsets.symmetric(vertical: 6),
                            padding: const EdgeInsets.all(12),
                            decoration: BoxDecoration(
                              color: isJarvis
                                  ? const Color(0xFF0D2137)
                                  : const Color(0xFF122C34),
                              borderRadius: BorderRadius.circular(10),
                              border: Border.all(
                                color: isJarvis
                                    ? const Color(0xFF00E5FF)
                                    : const Color(0xFF26A69A),
                              ),
                            ),
                            child: Text(
                              '${item['role']}: ${item['msg']}',
                              style: const TextStyle(color: Colors.white),
                            ),
                          );
                        },
                      ),
                    ),
                    Padding(
                      padding: const EdgeInsets.all(12.0),
                      child: Row(
                        children: [
                          Expanded(
                            child: TextField(
                              controller: _inputController,
                              onSubmitted: _sendCommand,
                              decoration: InputDecoration(
                                hintText: 'Rayt kɔmand (status, time, hello)...',
                                filled: true,
                                fillColor: const Color(0xFF0A1526),
                                border: OutlineInputBorder(
                                  borderRadius: BorderRadius.circular(8),
                                ),
                              ),
                            ),
                          ),
                          const SizedBox(width: 8),
                          IconButton(
                            icon: const Icon(Icons.send, color: Color(0xFF00E5FF)),
                            onPressed: () => _sendCommand(_inputController.text),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          EOF

      - name: Bild Nyu Release APK
        working-directory: fresh_jarvis
        run: flutter build apk --release

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: JarvisPro-Topg-Release-APK
          path: fresh_jarvis/build/app/outputs/flutter-apk/app-release.apk
